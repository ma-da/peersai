[project]
name = "peersai-webscraper"
version = "0.1.0"
description = "PEERSAI text cleaning and conversion utilities"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.0.0",
  "ftfy>=6.1.1",
  "chardet>=5.2.0",
  "ebooklib>=0.18"
]

[project.scripts]
peersai-clean = "webscraper.cli:main"
